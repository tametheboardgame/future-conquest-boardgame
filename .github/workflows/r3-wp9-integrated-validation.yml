name: R3 WP9 visual polish and integrated validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  R3_WP9_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  regression-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R3_WP9_REF }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile deterministic game fixture
        shell: bash
        run: |
          npx tsc -p tsconfig.test.json
          printf '{"type":"commonjs"}\n' > .test-dist/package.json
      - name: Run WP9 continuity, readability and resilience contracts
        run: |
          node --test tests/persistence.test.cjs tests/persistence-ui.test.cjs tests/map-session-mobile-readability.test.cjs tests/r3-wp2f-reduced-motion-layout-frame.test.cjs
          node --test tests/r3-wp4-battle-event-feedback.test.cjs tests/r3-wp5-strategic-information-layers.test.cjs tests/r3-wp6-command-ui.test.cjs tests/r3-wp6-5-interface-polish.test.cjs tests/r3-wp6-6-command-shell-follow-up.test.cjs tests/r3-wp7-audio-music-atmosphere.test.cjs tests/r3-wp8-performance-accessibility-resilience.test.cjs tests/r3-wp9-integrated-validation.test.cjs
      - name: Run full regression suite
        run: npm test
      - name: Run terrain performance contracts
        run: node --test tests/r3-wp2e-*.test.cjs
      - name: Build exact production game
        run: npm run build
      - name: Enforce terrain payload budgets
        run: node scripts/measure-r3-terrain-budget.mjs

  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R3_WP9_REF }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile deterministic game fixture
        shell: bash
        run: |
          npx tsc -p tsconfig.test.json
          printf '{"type":"commonjs"}\n' > .test-dist/package.json
      - name: Build exact production game
        run: npm run build
      - name: Install browser review runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Adapt historical browser probes to explicit BG12D diagnostics mode
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          for (const path of [
            'scripts/probe-r3-wp4-battle-feedback.mjs',
            'scripts/probe-r3-wp5-strategic-information.mjs',
            'scripts/probe-r3-wp6-command-ui.mjs',
            'scripts/probe-r3-wp6-notifications.mjs',
            'scripts/probe-r3-wp6-accessibility.mjs',
            'scripts/probe-r3-wp6-5-interface-polish.mjs'
          ]) {
            const source = fs.readFileSync(path, 'utf8');
            const routed = source
              .replace('/?terrain=1', '/?terrain=1&legacy-ui=1')
              .replace('/?terrain=0', '/?terrain=0&legacy-ui=1');
            if (routed === source) throw new Error(`Historical probe has no terrain route to quarantine: ${path}`);
            fs.writeFileSync(path, routed);
          }

          const commandPath = 'scripts/probe-r3-wp6-command-ui.mjs';
          let commandSource = fs.readFileSync(commandPath, 'utf8');
          for (const view of ['engineering', 'territories']) {
            const needle = `  await page.locator('[data-command-view="${view}"]').click();`;
            const replacement = `  await page.locator('.command-nav-legacy summary').click();\n${needle}`;
            if (!commandSource.includes(needle)) throw new Error(`Historical command probe hook missing for ${view}`);
            commandSource = commandSource.replace(needle, replacement);
          }
          fs.writeFileSync(commandPath, commandSource);

          const polishPath = 'scripts/probe-r3-wp6-5-interface-polish.mjs';
          let polishSource = fs.readFileSync(polishPath, 'utf8');
          const selectorNeedle = "const navRects = [...document.querySelectorAll('.command-nav-items button')].map(node => {";
          const selectorReplacement = "const navRects = [...document.querySelectorAll('.command-nav-primary button')].map(node => {";
          const countNeedle = "assert(heights.length === 8, `expected eight persistent command items, got ${heights.length}`);";
          const countReplacement = "assert(heights.length === 5, `expected four primary routes plus reserved Cards, got ${heights.length}`);";
          if (!polishSource.includes(selectorNeedle) || !polishSource.includes(countNeedle)) {
            throw new Error('Historical WP6.5 navigation hooks no longer match expected source');
          }
          polishSource = polishSource.replace(selectorNeedle, selectorReplacement).replace(countNeedle, countReplacement);
          const clickNeedle = '    await page.locator(`[data-command-view="${view}"]`).click();';
          const clickReplacement = `    if (['territories', 'engineering', 'logistics', 'intelligence'].includes(view)) {\n      await page.locator('[data-command-view="' + view + '"]').evaluate(node => node.click());\n    } else {\n      await page.locator('[data-command-view="' + view + '"]').click();\n    }`;
          if (!polishSource.includes(clickNeedle)) throw new Error('Historical WP6.5 specialist sweep hook missing');
          polishSource = polishSource.replace(clickNeedle, clickReplacement);
          fs.writeFileSync(polishPath, polishSource);

          const battlePath = 'scripts/probe-r3-wp4-battle-feedback.mjs';
          let battleSource = fs.readFileSync(battlePath, 'utf8');
          for (const method of ['uncheck', 'check']) {
            const needle = `  await operationsToggle.${method}();`;
            const replacement = `  await operationsToggle.evaluate(node => node.click());`;
            if (!battleSource.includes(needle)) throw new Error(`Historical WP4 layer-toggle hook missing for ${method}`);
            battleSource = battleSource.replace(needle, replacement);
          }
          fs.writeFileSync(battlePath, battleSource);
          NODE
      - name: Review battle and strategic information presentation
        shell: bash
        run: |
          set -o pipefail
          node scripts/probe-r3-wp4-battle-feedback.mjs 2>&1 | tee wp9-wp4-browser.log
          node scripts/probe-r3-wp5-strategic-information.mjs 2>&1 | tee wp9-wp5-browser.log
      - name: Start exact production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/r3-wp9-preview.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r3-wp9-preview.log
          exit 1
      - name: Capture BG12G-R authoritative 2D6 manual-review evidence
        env:
          BG12G_R_REF: ${{ env.R3_WP9_REF }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const outputDir = 'artifacts/bg12g-r';
          fs.mkdirSync(outputDir, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1600, height: 900 },
            reducedMotion: 'no-preference',
            recordVideo: { dir: `${outputDir}/raw-video`, size: { width: 1600, height: 900 } }
          });
          await context.addInitScript(() => {
            localStorage.setItem('future-conquest:intro-seen:v3', 'true');
            localStorage.setItem('future-conquest-tutorial-seen-v1', 'true');
            window.__bg12gDiceReviewEvents = [];
            window.addEventListener('future-conquest:dice-clatter', event => {
              window.__bg12gDiceReviewEvents.push(event.detail);
            });
          });
          const page = await context.newPage();
          const video = page.video();
          const errors = [];
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
          page.on('pageerror', error => errors.push(error.message));

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          try {
            await page.goto('http://127.0.0.1:4173/?terrain=0&legacy-ui=1', { waitUntil: 'domcontentloaded' });
            await page.getByRole('button', { name: 'BEGIN CAMPAIGN', exact: true }).click();
            await page.locator('.bg12e-tabletop-layout').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('.bg12e-rail-switcher').getByRole('button', { name: 'Combat', exact: true }).click();
            await page.locator('.tabletop-combat-panel[data-bg-dice-model="BG12G-R-2D6"]').waitFor({ state: 'visible', timeout: 5000 });

            const closeGuide = page.getByRole('button', { name: /close guide/i });
            if (await closeGuide.count() > 0 && await closeGuide.first().isVisible()) {
              await closeGuide.first().click();
            }

            await page.waitForFunction(() => {
              const select = document.querySelector('.tabletop-combat-attacker select');
              return select && !select.disabled;
            }, null, { timeout: 10000 });

            const attackerSelect = page.locator('.tabletop-combat-attacker select');
            const attackerValues = await attackerSelect.locator('option').evaluateAll(options =>
              options.map(option => option.value).filter(Boolean)
            );
            let attacker = null;
            for (const value of attackerValues) {
              await attackerSelect.selectOption(value);
              await page.waitForTimeout(120);
              if (await page.locator('.tabletop-combat-targets button').count() > 0) {
                attacker = value;
                break;
              }
            }
            assert(attacker, 'no human formation exposed a legal BG12G-R combat target');

            const targetButton = page.locator('.tabletop-combat-targets button').first();
            const targetLabel = (await targetButton.innerText()).replace(/\s+/g, ' ').trim();
            await targetButton.click();
            await page.locator('.bg12g-pre-roll .bg12g-roll-button').waitFor({ state: 'visible', timeout: 5000 });
            const previewLabel = await page.locator('.bg12g-pre-roll .bg12g-tray').getAttribute('aria-label');
            const previewCopy = (await page.locator('.bg12g-pre-roll').innerText()).replace(/\s+/g, ' ').trim();
            await page.screenshot({ path: `${outputDir}/01-pre-roll.png`, fullPage: false });

            await page.locator('.bg12g-pre-roll .bg12g-roll-button').click();
            await page.locator('.bg12g-resolved-tray.rolling').waitFor({ state: 'visible', timeout: 5000 });
            await page.screenshot({ path: `${outputDir}/02-roll-start.png`, fullPage: false });
            await page.waitForTimeout(420);
            await page.screenshot({ path: `${outputDir}/03-roll-mid.png`, fullPage: false });
            await page.locator('.bg12g-resolved-tray.settled').waitFor({ state: 'visible', timeout: 5000 });
            await page.waitForTimeout(120);
            await page.screenshot({ path: `${outputDir}/04-roll-settled.png`, fullPage: false });

            const dice = await page.locator('.bg12g-resolved-tray .bg12g-d6-stage').evaluateAll(nodes =>
              nodes.map(node => Number(node.getAttribute('data-authoritative-result')))
            );
            const resultLabel = await page.locator('.bg12g-resolved-tray .bg12g-tray').getAttribute('aria-label');
            const resultCopy = (await page.locator('.bg12g-resolved-tray').innerText()).replace(/\s+/g, ' ').trim();
            const events = await page.evaluate(() => window.__bg12gDiceReviewEvents ?? []);
            const relevantErrors = errors.filter(error => !/favicon|ERR_ABORTED|Failed to load resource.*404/i.test(error));

            assert(dice.length === 2 && dice.every(value => Number.isInteger(value) && value >= 1 && value <= 6), `invalid authoritative D6 faces: ${JSON.stringify(dice)}`);
            assert(events.some(event => event?.diceType === '2d6' && event?.phase === 'start'), `missing 2D6 start event: ${JSON.stringify(events)}`);
            const settled = events.find(event => event?.diceType === '2d6' && event?.phase === 'settled');
            assert(settled, `missing 2D6 settled event: ${JSON.stringify(events)}`);
            assert(Array.isArray(settled.dice) && settled.dice[0] === dice[0] && settled.dice[1] === dice[1], `settled event faces diverged from visible authoritative dice: ${JSON.stringify({ dice, settled })}`);
            assert(settled.total === dice[0] + dice[1], `settled total does not equal visible D6 faces: ${JSON.stringify({ dice, settled })}`);
            assert(relevantErrors.length === 0, `browser errors during 2D6 review capture: ${JSON.stringify(relevantErrors)}`);

            fs.writeFileSync(`${outputDir}/evidence.json`, `${JSON.stringify({
              schemaVersion: 1,
              head: process.env.BG12G_R_REF ?? process.env.GITHUB_SHA ?? null,
              attacker,
              targetLabel,
              previewLabel,
              previewCopy,
              dice,
              total: settled.total,
              resultLabel,
              resultCopy,
              clatterEvents: events,
              screenshots: ['01-pre-roll.png', '02-roll-start.png', '03-roll-mid.png', '04-roll-settled.png'],
              video: 'bg12g-r-dice-roll.webm'
            }, null, 2)}\n`);
            await page.waitForTimeout(900);
            console.log(`BG12G-R manual-review capture passed: ${attacker} rolled ${dice.join('+')} = ${settled.total}.`);
          } finally {
            await context.close();
            if (video) {
              const rawVideo = await video.path();
              fs.copyFileSync(rawVideo, path.join(outputDir, 'bg12g-r-dice-roll.webm'));
            }
            await browser.close();
          }
          NODE
      - name: Prove BG12D normal-play quarantine and diagnostics route
        run: node scripts/probe-bg12d-legacy-quarantine.mjs
      - name: Review historical map shell, notifications and keyboard access in diagnostics mode
        run: |
          node scripts/probe-r3-wp6-command-ui.mjs
          node scripts/probe-r3-wp6-notifications.mjs
          node scripts/probe-r3-wp6-accessibility.mjs
      - name: Review historical desktop, compact and reduced-motion presentation in diagnostics mode
        run: node scripts/probe-r3-wp6-5-interface-polish.mjs
      - name: Validate browser save, reload and continue continuity
        env:
          R3_WP9_REF: ${{ env.R3_WP9_REF }}
        run: node scripts/probe-r3-wp9-session-continuity.mjs
      - name: Upload integrated WP9 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp9-integrated-browser-${{ env.R3_WP9_REF }}
          path: |
            artifacts/bg12g-r
            artifacts/r3-wp6
            artifacts/r3-wp6-5
            artifacts/r3-wp9
            wp4-active-attack.png
            wp4-recent-victory.png
            wp5-strategic-information.png
            wp9-wp4-browser.log
            wp9-wp5-browser.log
            /tmp/r3-wp9-preview.log
          if-no-files-found: warn

  campaign-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FC_BALANCE_RUNS_PER_START: '4'
      FC_BALANCE_MAX_TURNS: '120'
      FC_BALANCE_SEED_OFFSET: '1'
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R3_WP9_REF }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run current-engine representative campaign simulations
        run: npm run simulate:current-balance
      - name: Trace representative stalled campaigns
        run: node scripts/trace-current-engine-balance.mjs
      - name: Upload campaign trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp9-campaign-traces-${{ env.R3_WP9_REF }}
          path: balance-output/
          if-no-files-found: warn