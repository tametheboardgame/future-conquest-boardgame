name: BG12J coach-mark onboarding

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BG12J_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact BG12J head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BG12J_REF }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run BG12J and protected tutorial contracts
        run: |
          node --test tests/bg12j-coach-mark-onboarding.test.cjs tests/dynamic-tutorial.test.cjs tests/tutorial-explanation-phases.test.cjs tests/wp8-guided-help-remediation.test.cjs tests/bg11a-onboarding-feedback.test.cjs
      - name: Run full regression suite
        run: npm test
      - name: Build exact production game
        run: npm run build
      - name: Install browser evidence runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start exact production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/bg12j-preview.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bg12j-preview.log
          exit 1
      - name: Capture coach-mark onboarding evidence
        env:
          BG12J_REF: ${{ env.BG12J_REF }}
          BG12J_BASE_URL: http://127.0.0.1:4173
          BG12J_OUTPUT_DIR: artifacts/bg12j
        run: node scripts/capture-bg12j-coach-mark-onboarding.mjs
      - name: Upload BG12J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg12j-coach-mark-onboarding-${{ env.BG12J_REF }}
          path: |
            artifacts/bg12j
            /tmp/bg12j-preview.log
          if-no-files-found: warn
