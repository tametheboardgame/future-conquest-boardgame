name: R3 WP2B browser runtime probe

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/TerrainMapPrototype*.tsx'
      - 'src/App.tsx'
      - 'src/presentation/r3-terrain-*.ts'
      - 'src/presentation/r3-formation-miniatures-layer.ts'
      - 'src/presentation/r3-world-miniatures-layer.ts'
      - 'src/r3-terrain-prototype.css'
      - 'src/wp3-5-physical-overlay.css'
      - 'public/generated/r3-terrain/**'
      - 'scripts/measure-r3-terrain-budget.mjs'
      - 'tests/r3-wp2b-*.test.cjs'
      - 'tests/r3-production-terrain-default.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/r3-wp2b-browser-runtime-probe.yml'

permissions:
  contents: read

jobs:
  chromium-terrain-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Build game
        run: npm run build
      - name: Install Chromium runtime probe
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/future-conquest-vite.log 2>&1 &
          echo $! > /tmp/future-conquest-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/future-conquest-vite.log
          exit 1
      - name: Verify representative terrain assets over HTTP
        run: |
          curl -fsSI http://127.0.0.1:4173/generated/r3-terrain/tiles.json
          curl -fsSI http://127.0.0.1:4173/generated/r3-terrain/tiles/4/8/5.png
      - name: Exercise visible terrain renderer in Chromium
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
          page.on('console', message => console.log(`[browser console ${message.type()}] ${message.text()}`));
          page.on('pageerror', error => console.log(`[browser pageerror] ${error.stack ?? error.message}`));
          page.on('requestfailed', request => console.log(`[request failed] ${request.url()} :: ${request.failure()?.errorText ?? 'unknown'}`));

          await page.addInitScript(() => {
            localStorage.setItem('future-conquest:intro-seen:v3', 'true');
            localStorage.setItem('future-conquest-tutorial-seen-v1', 'true');
          });
          // This must remain the unqualified production entry URL. A query-gated
          // renderer would make this exact-browser recovery check fail.
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });

          await page.getByRole('button', { name: 'BEGIN CAMPAIGN', exact: true }).click();
          await page.locator('.startup-game-shell').waitFor({ state: 'visible', timeout: 10000 });
          await page.locator('[data-command-view="map"]').click();
          await page.locator('.command-map-workspace').waitFor({ state: 'visible', timeout: 10000 });
          if (await page.locator('.startup-launcher').isVisible()) {
            await browser.close();
            throw new Error('Terrain visual probe remained covered by the title launcher.');
          }

          const ready = page.locator('.r3-terrain-prototype[data-status="ready"]');
          const fallback = page.locator('.r3-terrain-fallback-notice');
          await Promise.race([
            ready.waitFor({ state: 'visible', timeout: 30000 }).catch(() => undefined),
            fallback.waitFor({ state: 'visible', timeout: 30000 }).catch(() => undefined)
          ]);

          if (await fallback.isVisible()) {
            const text = await fallback.innerText();
            await browser.close();
            throw new Error(`Terrain renderer fell back in Chromium: ${text}`);
          }
          if (!(await ready.isVisible())) {
            const state = await page.evaluate(() => ({
              terrainStatus: document.querySelector('.r3-terrain-prototype')?.getAttribute('data-status') ?? null,
              canvasCount: document.querySelectorAll('.maplibregl-canvas').length,
              canvasWidth: document.querySelector('.maplibregl-canvas')?.getBoundingClientRect().width ?? 0,
              canvasHeight: document.querySelector('.maplibregl-canvas')?.getBoundingClientRect().height ?? 0
            }));
            console.log('Terrain DOM state:', JSON.stringify(state));
            await browser.close();
            throw new Error('Terrain renderer neither became ready nor surfaced fallback diagnostics.');
          }

          await page.locator('.r3-terrain-task-group-marker').first().waitFor({ state: 'attached', timeout: 10000 });
          await page.waitForFunction(() => document.querySelector('.r3-terrain-prototype')?.getAttribute('data-physical-formations') === 'ready', null, { timeout: 15000 });
          await page.waitForFunction(() => (window.__r3FormationMiniatures?.renderCount ?? 0) > 0, null, { timeout: 10000 });
          const piecePresentation = await page.evaluate(() => {
            const marker = document.querySelector('.r3-terrain-task-group-marker');
            const physical = window.__r3FormationMiniatures;
            const markerStyle = marker instanceof HTMLElement ? getComputedStyle(marker) : null;
            const formationState = marker instanceof HTMLElement
              ? marker.querySelector(':scope > .bg12i-formation-state')
              : null;
            const formationStateStyle = formationState instanceof HTMLElement ? getComputedStyle(formationState) : null;
            const formationStateRect = formationState instanceof HTMLElement ? formationState.getBoundingClientRect() : null;
            return {
              physicalRenderCount: physical?.renderCount ?? 0,
              physicalVisible: physical?.pieces.filter(piece => piece.visible).length ?? 0,
              compatibilityMarkerOpacity: markerStyle?.opacity ?? null,
              compatibilityMarkerPosition: markerStyle?.position ?? null,
              compatibilityMarkerBackground: markerStyle?.backgroundColor ?? null,
              compatibilityMarkerBorderColor: markerStyle?.borderTopColor ?? null,
              compatibilityMarkerBoxShadow: markerStyle?.boxShadow ?? null,
              formationStateVisible: Boolean(formationState instanceof HTMLElement
                && formationStateStyle
                && formationStateStyle.display !== 'none'
                && formationStateStyle.visibility !== 'hidden'
                && Number(formationStateStyle.opacity) > 0
                && formationStateRect
                && formationStateRect.width > 0
                && formationStateRect.height > 0),
              markerKind: marker instanceof HTMLElement ? marker.dataset.r3MarkerKind ?? null : null
            };
          });
          console.log('WP3.5 physical formation presentation:', JSON.stringify(piecePresentation));
          if (piecePresentation.physicalRenderCount < 1 || piecePresentation.physicalVisible < 1) {
            throw new Error(`WP3.5 physical formation layer is inactive: ${JSON.stringify(piecePresentation)}`);
          }
          const transparent = value => value === 'rgba(0, 0, 0, 0)' || value === 'transparent';
          if (Number(piecePresentation.compatibilityMarkerOpacity) <= 0
            || piecePresentation.compatibilityMarkerPosition !== 'absolute'
            || !piecePresentation.markerKind
            || !transparent(piecePresentation.compatibilityMarkerBackground)
            || !transparent(piecePresentation.compatibilityMarkerBorderColor)
            || piecePresentation.compatibilityMarkerBoxShadow !== 'none'
            || !piecePresentation.formationStateVisible) {
            throw new Error(`WP3.5 compatibility target lost its transparent BG12I state-strip contract: ${JSON.stringify(piecePresentation)}`);
          }

          await page.waitForTimeout(1200);
          const visualState = await page.evaluate(() => {
            const host = document.querySelector('.r3-terrain-prototype-canvas');
            const canvas = document.querySelector('.maplibregl-canvas');
            const container = document.querySelector('.maplibregl-canvas-container');
            const describe = element => {
              if (!(element instanceof HTMLElement)) return null;
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                width: rect.width,
                height: rect.height,
                display: style.display,
                visibility: style.visibility,
                opacity: style.opacity,
                position: style.position,
                zIndex: style.zIndex,
                background: style.backgroundColor
              };
            };
            return {
              host: describe(host),
              canvas: describe(canvas),
              container: describe(container),
              canvasBackingWidth: canvas instanceof HTMLCanvasElement ? canvas.width : 0,
              canvasBackingHeight: canvas instanceof HTMLCanvasElement ? canvas.height : 0
            };
          });
          console.log('Terrain visual DOM:', JSON.stringify(visualState));

          const canvasCount = await page.locator('.maplibregl-canvas').count();
          if (canvasCount < 1) throw new Error('Terrain reported ready without a MapLibre canvas.');
          if (!visualState.host || visualState.host.width < 300 || visualState.host.height < 250) {
            throw new Error(`Terrain host has invalid visible dimensions: ${JSON.stringify(visualState.host)}`);
          }
          if (!visualState.canvas || visualState.canvas.width < 300 || visualState.canvas.height < 250) {
            throw new Error(`Terrain canvas has invalid visible dimensions: ${JSON.stringify(visualState.canvas)}`);
          }
          if (visualState.canvas.display === 'none' || visualState.canvas.visibility === 'hidden' || Number(visualState.canvas.opacity) <= 0) {
            throw new Error(`Terrain canvas is hidden by CSS: ${JSON.stringify(visualState.canvas)}`);
          }

          const mapHost = page.locator('.r3-terrain-prototype-canvas');
          await mapHost.screenshot({ path: '/tmp/r3-terrain-visible.png' });
          const png = PNG.sync.read(fs.readFileSync('/tmp/r3-terrain-visible.png'));
          const counts = new Map();
          let samples = 0;
          const xStart = Math.floor(png.width * 0.08);
          const xEnd = Math.floor(png.width * 0.92);
          const yStart = Math.floor(png.height * 0.10);
          const yEnd = Math.floor(png.height * 0.92);
          for (let y = yStart; y < yEnd; y += 8) {
            for (let x = xStart; x < xEnd; x += 8) {
              const index = (png.width * y + x) << 2;
              const key = `${png.data[index] >> 3},${png.data[index + 1] >> 3},${png.data[index + 2] >> 3}`;
              counts.set(key, (counts.get(key) ?? 0) + 1);
              samples += 1;
            }
          }
          const ranked = [...counts.entries()].sort((a, b) => b[1] - a[1]);
          const dominantRatio = ranked.length ? ranked[0][1] / samples : 1;
          console.log('Terrain screenshot pixels:', JSON.stringify({ width: png.width, height: png.height, sampledPixels: samples, quantisedColours: counts.size, dominantRatio, topColours: ranked.slice(0, 8) }));
          if (counts.size < 24 || dominantRatio > 0.97) {
            throw new Error(`Terrain canvas is visually blank or near-uniform: ${counts.size} colours, dominant ratio ${dominantRatio.toFixed(4)}`);
          }

          console.log(`MapLibre terrain visibly rendered in the campaign map with ${canvasCount} canvas element(s).`);

          const fallbackPage = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
          await fallbackPage.addInitScript(() => {
            localStorage.setItem('future-conquest:intro-seen:v3', 'true');
            localStorage.setItem('future-conquest-tutorial-seen-v1', 'true');
          });
          await fallbackPage.goto('http://127.0.0.1:4173/?terrain=0', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await fallbackPage.getByRole('button', { name: 'BEGIN CAMPAIGN', exact: true }).click();
          await fallbackPage.locator('.startup-game-shell').waitFor({ state: 'visible', timeout: 10000 });
          await fallbackPage.locator('[data-command-view="map"]').click();
          await fallbackPage.locator('.command-map-workspace').waitFor({ state: 'visible', timeout: 10000 });
          await fallbackPage.locator('svg.map.europe-map').waitFor({ state: 'visible', timeout: 15000 });
          if (await fallbackPage.locator('.maplibregl-canvas').count()) {
            throw new Error('?terrain=0 did not force the SVG accessibility map.');
          }
          console.log('?terrain=0 forced the SVG command map.');
          await browser.close();
          NODE
      - name: Upload terrain visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-terrain-visible-diagnostic
          path: /tmp/r3-terrain-visible.png
          if-no-files-found: ignore
      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/future-conquest-vite.log || true
