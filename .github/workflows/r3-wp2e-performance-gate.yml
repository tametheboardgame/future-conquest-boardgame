name: R3 WP2E exact-head terrain performance gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/generated/r3-terrain/**'
      - 'scripts/run-r3-wp2e-performance.mjs'
      - 'scripts/compare-r3-wp2e-performance.mjs'
      - 'tests/r3-wp2e-*.test.cjs'
      - '.github/workflows/r3-wp2e-performance-gate.yml'

permissions:
  contents: read

jobs:
  chromium-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preserve the head-owned measurement probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          cp scripts/run-r3-wp2e-performance.mjs /tmp/run-r3-wp2e-performance.mjs
          cp scripts/compare-r3-wp2e-performance.mjs /tmp/compare-r3-wp2e-performance.mjs
      - name: Adapt benchmark selection to a structural territory control
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/run-r3-wp2e-performance.mjs')
          text = path.read_text()
          start = text.index('// Selected/local camera requires an actual selected territory.')
          end = text.index('await page.waitForFunction(() => {', start)
          replacement = '''// Selected/local camera requires an actual selected territory. Establish that
          // selection through any production territory-name control on both exact base
          // and head before timing either camera transition. Territory labels are real
          // buttons wired directly to onSelectTerritory. Marker visibility is a
          // decluttering/presentation decision and is intentionally outside this renderer
          // benchmark; dedicated browser/selection gates cover pointer-visible selection.
          const selectedTerritoryHandle = await page.waitForFunction(() => {
            const node = document.querySelector('button.r3-terrain-territory-label[data-territory-id]');
            if (!(node instanceof HTMLButtonElement)) return false;
            const territoryId = node.dataset.territoryId;
            if (!territoryId) return false;
            node.click();
            return territoryId;
          }, undefined, { timeout: 15_000 });
          const selectedTerritoryId = await selectedTerritoryHandle.jsonValue();
          if (typeof selectedTerritoryId !== 'string') {
            throw new Error('No structural territory control was available for benchmark selection.');
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Checkout exact PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Restore identical probe for base measurement
        run: cp /tmp/run-r3-wp2e-performance.mjs scripts/run-r3-wp2e-performance.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install exact Chromium probe
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production base
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/r3-wp2e-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r3-wp2e-vite.log; exit 1
      - name: Record three exact base timing samples
        env:
          R3_WP2E_BUILD_SHA: ${{ github.event.pull_request.base.sha }}
          R3_WP2E_VARIANT: base
          R3_WP2E_TILE_CANCELLATION: cancel
        run: |
          for sample in 1 2 3; do
            export R3_WP2E_EVIDENCE="artifacts/r3-wp2e-performance-base-${sample}.json"
            for attempt in 1 2; do
              set +e
              timeout 150s node scripts/run-r3-wp2e-performance.mjs
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
              echo "Base measurement sample ${sample} failed once (exit ${status}); retrying in a fresh Chromium process."
            done
          done
      - name: Stop base preview
        run: pkill -f 'vite preview' || true
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false
      - name: Restore identical probe for head measurement
        run: cp /tmp/run-r3-wp2e-performance.mjs scripts/run-r3-wp2e-performance.mjs
      - run: npm ci
      - name: Restore exact Chromium probe dependency
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Focused WP2E contracts
        run: node --test tests/r3-wp2e-*.test.cjs
      - run: npm run build
      - run: node scripts/measure-r3-terrain-budget.mjs
      - name: Start exact production head
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/r3-wp2e-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r3-wp2e-vite.log; exit 1
      - name: Record three exact head timing samples
        env:
          R3_WP2E_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          R3_WP2E_VARIANT: head
        run: |
          for sample in 1 2 3; do
            export R3_WP2E_EVIDENCE="artifacts/r3-wp2e-performance-head-${sample}.json"
            for attempt in 1 2; do
              set +e
              timeout 150s node scripts/run-r3-wp2e-performance.mjs
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
              echo "Head measurement sample ${sample} failed once (exit ${status}); retrying in a fresh Chromium process."
            done
          done
      - name: Record explicit MapLibre cancellation A/B evidence
        env:
          R3_WP2E_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          R3_WP2E_VARIANT: head-cancel-pending-tiles
          R3_WP2E_TILE_CANCELLATION: cancel
          R3_WP2E_EVIDENCE: artifacts/r3-wp2e-performance-head-cancel-pending-tiles.json
        run: |
          set +e
          timeout 150s node scripts/run-r3-wp2e-performance.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'WP2E cancellation diagnostic failed once; retrying in a fresh Chromium process.'
            timeout 150s node scripts/run-r3-wp2e-performance.mjs
          fi
      - name: Assert identities, compare timing medians and enforce unchanged regression budgets
        run: >-
          node scripts/compare-r3-wp2e-performance.mjs
          artifacts/r3-wp2e-performance-base-1.json,artifacts/r3-wp2e-performance-base-2.json,artifacts/r3-wp2e-performance-base-3.json
          artifacts/r3-wp2e-performance-head-1.json,artifacts/r3-wp2e-performance-head-2.json,artifacts/r3-wp2e-performance-head-3.json
          artifacts/r3-wp2e-performance-comparison.json
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.pull_request.head.sha }}'
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp2e-performance-${{ github.event.pull_request.head.sha }}
          path: artifacts/r3-wp2e-performance-*.json
          if-no-files-found: error
