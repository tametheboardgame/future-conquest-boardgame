name: Build and deploy Future Conquest

# Deployment refresh: 2026-08-07 06:01 BST
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # Queue runs on each ref rather than allowing a later push to cancel an active
  # production release containing newly generated artwork.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile engine tests
        run: |
          rm -rf .test-dist
          npx tsc -p tsconfig.test.json
          printf '{"type":"commonjs"}\n' > .test-dist/package.json
      - name: Run BG1-BG2 tests
        if: always()
        run: node --test tests/bg1-*.test.cjs tests/bg2-*.test.cjs
      - name: Run BG3-BG5 tests
        if: always()
        run: node --test tests/bg3-*.test.cjs tests/bg4-*.test.cjs tests/bg5*.test.cjs
      - name: Run BG6-BG7 tests
        if: always()
        run: node --test tests/bg6-*.test.cjs tests/bg7-*.test.cjs
      - name: Run BG8-BG9 tests
        if: always()
        run: node --test tests/bg8-*.test.cjs tests/bg9-*.test.cjs
      - name: Run BG10 tests
        if: always()
        run: node --test tests/bg10-*.test.cjs
      - name: Run remaining engine tests
        if: always()
        run: node --test tests/engine.test.cjs
      - name: Validate deployment verifier
        run: node --check scripts/verify-pages-deployment.mjs
      - name: Build game
        run: npm run build
      - name: Write deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('dist/build-info.json', JSON.stringify({ sha: process.env.GITHUB_SHA, runNumber: process.env.GITHUB_RUN_NUMBER, runAttempt: process.env.GITHUB_RUN_ATTEMPT, builtAt: new Date().toISOString() }, null, 2) + '\n');"
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live deployment commit and title asset
        timeout-minutes: 7
        env:
          DEPLOY_VERIFY_ATTEMPTS: '30'
          DEPLOY_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-pages-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
